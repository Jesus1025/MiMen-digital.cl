<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MiMenú{% endblock %}</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#151410">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
    <style>
        :root { --ink: #151410; --soft: #66645c; --line: #dedcd3; --bg: #efeee9; --paper: #fff; --sol: #ffc21a; --error: #c62f1d; --ok: #137a3f; }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 400 16px/1.55 "Hanken Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        a { color: inherit; }
        .barra { background: var(--ink); color: #fff; }
        .barra .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font: 800 21px/1 "Bricolage Grotesque", sans-serif; display: flex; align-items: center; gap: 9px; text-decoration: none; }
        .logo i { width: 28px; height: 28px; border-radius: 8px; background: var(--sol); display: grid; place-items: center; }
        .logo svg { width: 16px; height: 16px; color: var(--ink); }
        .barra nav a { font-weight: 600; font-size: 15px; text-decoration: none; opacity: .85; }
        main { flex: 1; display: grid; place-items: center; padding: 48px 20px; }
        .caja { width: 100%; max-width: {% block ancho %}440px{% endblock %}; background: var(--paper); border: 1px solid var(--line); border-radius: 28px; padding: 36px 32px; }
        .simbolo { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 20px; background: var(--bg); }
        .simbolo svg { width: 28px; height: 28px; }
        .simbolo.ok { background: #e3f6ea; color: var(--ok); }
        .simbolo.error { background: #fdecea; color: var(--error); }
        .simbolo.espera { background: #fff4d1; color: #8a6400; }
        h1 { font: 800 32px/1.05 "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; }
        .sub { color: var(--soft); margin-top: 10px; }
        .grande { font: 800 72px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -.04em; color: var(--sol); -webkit-text-stroke: 2px var(--ink); margin-bottom: 8px; }
        form { margin-top: 24px; display: grid; gap: 16px; }
        label { font-weight: 600; font-size: 15px; display: block; margin-bottom: 6px; }
        input[type=text], input[type=email], input[type=password], input[type=tel], textarea, select {
            width: 100%; min-height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff;
            padding: 12px 16px; font: inherit; font-size: 16px; color: var(--ink); transition: border-color .15s ease, box-shadow .15s ease;
        }
        textarea { min-height: 130px; resize: vertical; }
        input:disabled { background: var(--bg); color: var(--soft); }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 4px rgba(255,194,26,.45); }
        .ayuda { font-size: 14px; color: var(--soft); margin-top: 6px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px;
            border: 0; border-radius: 14px; font: 700 16px "Hanken Grotesk", sans-serif; text-decoration: none; cursor: pointer;
            transition: transform .15s ease, background .2s ease;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-negro { background: var(--ink); color: #fff; }
        .btn-negro:hover { background: #000; }
        .btn-sol { background: var(--sol); color: var(--ink); }
        .btn-borde { border: 1.5px solid var(--line); background: #fff; color: var(--ink); }
        .botones { display: grid; gap: 10px; margin-top: 26px; }
        .aviso { border-radius: 12px; padding: 12px 14px; font-size: 15px; font-weight: 500; margin-top: 18px; background: var(--bg); border: 1px solid var(--line); }
        .aviso.error, .aviso.danger { border-color: #f1c2bb; background: #fdf0ee; color: var(--error); }
        .aviso.success { border-color: #bfe6cd; background: #eef9f2; color: var(--ok); }
        .aviso.warning, .aviso.info { border-color: #f3dfa0; background: #fff8e1; color: #6b4e00; }
        .datos { margin-top: 20px; border-top: 1px solid var(--line); }
        .datos div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
        .datos dt { color: var(--soft); }
        .datos dd { font-weight: 600; text-align: right; }
        .pie-caja { margin-top: 22px; font-size: 15px; color: var(--soft); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .pie-caja a { font-weight: 600; text-decoration: none; color: var(--ink); }
        :focus-visible { outline: 3px solid var(--sol); outline-offset: 2px; }
        @media (max-width: 480px) { .caja { padding: 28px 22px; border-radius: 22px; } h1 { font-size: 28px; } }
        {% block css %}{% endblock %}
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-qr" viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h8v8H3V3Zm2 2v4h4V5H5Zm8-2h8v8h-8V3Zm2 2v4h4V5h-4ZM3 13h8v8H3v-8Zm2 2v4h4v-4H5Zm8-2h2v2h-2v-2Zm2 2h2v2h-2v-2Zm-2 2h2v2h-2v-2Zm4 0h4v2h-2v2h-2v-4Zm2-4h2v2h-2v-2Zm-4 6h2v2h-2v-2Z"/></symbol>
        <symbol id="i-ok" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
        <symbol id="i-reloj" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
        <symbol id="i-llave" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m11 12 9-9m-3 3 3 3m-6 0 2 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
        <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 10v4m0 3v.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    </svg>
    <header class="barra">
        <div class="wrap">
            <a class="logo" href="/"><i><svg><use href="#i-qr"/></svg></i>MiMenú</a>
            <nav>{% block nav %}<a href="{{ url_for('login') }}">Ingresar</a>{% endblock %}</nav>
        </div>
    </header>
    <main>
        <div class="caja">{% block contenido %}{% endblock %}</div>
    </main>
    {% block js %}{% endblock %}
</body>
</html>
